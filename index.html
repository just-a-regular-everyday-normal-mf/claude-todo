<style>
/* Layout: one narrow reading column; overall gauge on top, topic chips, then collapsible groups of tickable rows. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --fg:#14201c; --muted:#5b6b65; --line:#d5dcd9;
  --accent:#0b7a5a; --accent-soft:#d9efe7; --done:#8a9892;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1714; --surface:#16211d; --fg:#e4efe9; --muted:#8fa49b; --line:#27362f;
  --accent:#4fd1a5; --accent-soft:#17382c; --done:#5f736a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1714; --surface:#16211d; --fg:#e4efe9; --muted:#8fa49b; --line:#27362f;
  --accent:#4fd1a5; --accent-soft:#17382c; --done:#5f736a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,7vw,40px);line-height:1.05;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;max-width:60ch}
.gauge{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.gauge-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.big{font-family:var(--f-mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--accent-soft);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.on{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{white-space:nowrap;display:flex;gap:8px;align-items:center}
.chip small{font-family:var(--f-mono);color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.chip.on small{color:var(--bg)}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h2{font-family:var(--f-display);font-weight:600;font-size:24px;margin:0}
.sec-head span{font-family:var(--f-mono);color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.groups{display:flex;flex-direction:column;gap:10px}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px}
summary{cursor:pointer;list-style:none;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:500}
summary::-webkit-details-marker{display:none}
summary .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
summary::after{content:"+";font-family:var(--f-mono);color:var(--muted)}
details[open]>summary::after{content:"\2212"}
summary .t{flex:1;min-width:0}
ul{list-style:none;margin:0;padding:0 16px 10px;display:flex;flex-direction:column}
li{border-top:1px solid var(--line)}
label{display:flex;gap:12px;align-items:flex-start;padding:9px 0;cursor:pointer;min-width:0}
input[type=checkbox]{appearance:none;flex:none;width:20px;height:20px;margin-top:1px;border:1.5px solid var(--muted);border-radius:4px;background:transparent;cursor:pointer;display:grid;place-content:center}
input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
input[type=checkbox]:checked::after{content:"";width:5px;height:10px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
label span{min-width:0;overflow-wrap:anywhere}
input:checked+span{color:var(--done);text-decoration:line-through;text-decoration-color:var(--line)}
.hide-done li.d{display:none}
.confirm{display:none;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted)}
.confirm.show{display:flex}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>

var KEY="bmc-v1", state={}, hideDone=false;
function load(){try{state=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){state={}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function id(s,g,i){return s+"-"+g+"-"+i}
var total=0;DATA.forEach(function(s){s.n=0;s.g.forEach(function(g){s.n+=g.i.length});total+=s.n});

function render(){
  var main=document.getElementById("main"),chips=document.getElementById("chips");
  var html="",ch="";
  DATA.forEach(function(s,si){
    ch+='<button class="chip" type="button" data-s="'+si+'">'+s.t+' <small id="cs'+si+'"></small></button>';
    html+='<section id="sec'+si+'" style="margin-top:6px"><div class="sec-head"><h2>'+s.t+'</h2><span id="ss'+si+'"></span></div><div class="groups" style="margin-top:10px">';
    s.g.forEach(function(g,gi){
      html+='<details'+(si===0&&gi===0?' open':'')+'><summary><span class="t">'+g.g+'</span><span class="n" id="gs'+si+'_'+gi+'"></span></summary><ul>';
      g.i.forEach(function(txt,ii){
        var k=id(si,gi,ii);
        html+='<li id="li'+k+'"><label><input type="checkbox" data-k="'+k+'" id="c'+k+'"><span>'+txt.replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</span></label></li>';
      });
      html+='</ul></details>';
    });
    html+='</div></section>';
  });
  main.innerHTML=html;chips.innerHTML=ch;
  Array.prototype.forEach.call(document.querySelectorAll("input[type=checkbox]"),function(c){
    c.checked=!!state[c.getAttribute("data-k")];
  });
  update();
}
function update(){
  var all=0;
  DATA.forEach(function(s,si){
    var sd=0;
    s.g.forEach(function(g,gi){
      var gd=0;
      g.i.forEach(function(_,ii){
        var k=id(si,gi,ii),on=!!state[k];if(on){gd++}
        var li=document.getElementById("li"+k);if(li){li.className=on?"d":""}
      });
      sd+=gd;
      document.getElementById("gs"+si+"_"+gi).textContent=gd+" / "+g.i.length;
    });
    all+=sd;
    document.getElementById("ss"+si).textContent=sd+" / "+s.n;
    document.getElementById("cs"+si).textContent=sd+"/"+s.n;
  });
  document.getElementById("overall").textContent=all+" / "+total;
  document.getElementById("overall-bar").style.width=(total?all/total*100:0)+"%";
}
document.addEventListener("change",function(e){
  var k=e.target.getAttribute&&e.target.getAttribute("data-k");
  if(!k)return;
  if(e.target.checked){state[k]=1}else{delete state[k]}
  save();update();
});
document.getElementById("chips").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  var el=document.getElementById("sec"+b.getAttribute("data-s"));
  if(el){el.scrollIntoView({behavior:"smooth",block:"start"})}
});
var openAll=false;
document.getElementById("btn-open").addEventListener("click",function(){
  openAll=!openAll;
  Array.prototype.forEach.call(document.querySelectorAll("details"),function(d){d.open=openAll});
  this.textContent=openAll?"Collapse all":"Expand all";
});
document.getElementById("btn-hide").addEventListener("click",function(){
  hideDone=!hideDone;document.querySelector(".wrap").classList.toggle("hide-done",hideDone);
  this.classList.toggle("on",hideDone);this.textContent=hideDone?"Showing open only":"Hide ticked";
});
var cf=document.getElementById("confirm");
document.getElementById("btn-reset").addEventListener("click",function(){cf.classList.add("show")});
document.getElementById("btn-no").addEventListener("click",function(){cf.classList.remove("show")});
document.getElementById("btn-yes").addEventListener("click",function(){
  state={};save();
  Array.prototype.forEach.call(document.querySelectorAll("input[type=checkbox]"),function(c){c.checked=false});
  update();cf.classList.remove("show");
});
load();render();
</script>

</body></html>
